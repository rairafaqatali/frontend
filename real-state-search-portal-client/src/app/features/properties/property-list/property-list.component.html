<div class="container mt-3">
    <form [formGroup]="filterForm" class="row g-2">
        <div class="col">
            <input class="form-control" placeholder="City" formControlName="city">
        </div>
        <div class="col">
            <input class="form-control" placeholder="Bedrooms" formControlName="bedrooms">
        </div>
        <div class="col">
            <button class="btn btn-primary w-100" (click)="search()">Search</button>
        </div>
    </form>

    <div class="row mt-3">
        <div class="col-md-4" *ngFor="let p of properties">
            <div class="card mb-3 shadow-sm">

                <div class="card-body">
                    <h5 class="card-title">{{ p.title }}</h5>
                    <p class="card-text">
                        {{ p.address }} <br>
                        <strong>${{ p.price }}</strong>
                    </p>

                    <a [routerLink]="['/property', p.id]" class="btn btn-outline-primary btn-sm">
                        View Details
                    </a>
                </div>

            </div>
        </div>
        <div *ngIf="properties.length<=0">No properties found.</div>
    </div>



</div>
