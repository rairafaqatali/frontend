<div class="container mt-3">
  <h3>My Favorites</h3>
  <div class="row">
    <div class="col-md-4" *ngFor="let p of favorites">
      <div class="card mb-3">
        <img [src]="p.imageUrl" class="card-img-top">
        <div class="card-body">
          <h5>{{ p.title }}</h5>
        </div>
      </div>
    </div>
  </div>
</div>
